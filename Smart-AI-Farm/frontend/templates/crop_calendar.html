<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Calendar | Smart AI Farm</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .page-container {
            padding: 20px 20px 80px;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero {
            background: linear-gradient(135deg, #6d2b8a, #9b59b6);
            border-radius: 24px;
            padding: 28px;
            margin-bottom: 24px;
            text-align: center;
        }

        .hero h1 {
            font-size: 2rem;
            font-weight: 800;
        }

        .form-card {
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 0;
            margin-top: 10px;
        }

        .timeline-item {
            display: flex;
            gap: 15px;
            padding-bottom: 20px;
            position: relative;
        }

        .timeline-item:last-child {
            padding-bottom: 0;
        }

        .tl-dot-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            flex-shrink: 0;
        }

        .tl-dot {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            border: 3px solid transparent;
        }

        .tl-line {
            width: 2px;
            flex: 1;
            min-height: 20px;
            background: rgba(255, 255, 255, 0.1);
        }

        .tl-body {
            flex: 1;
            padding-top: 5px;
            padding-bottom: 10px;
        }

        .tl-day {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 3px;
        }

        .tl-task {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .tl-detail {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .status-completed {
            background: rgba(46, 204, 113, 0.15);
            border-color: #2ecc71;
        }

        .status-due-soon {
            background: rgba(241, 196, 15, 0.15);
            border-color: #f1c40f;
            animation: pulse 2s infinite;
        }

        .status-upcoming {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .info-strip {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .info-item {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }

        .info-val {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary-green);
        }

        .info-lbl {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: 0.6
            }
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 100;
        }

        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            gap: 5px;
            font-weight: 500;
        }

        .nav-item.active,
        .nav-item:hover {
            color: var(--primary-green);
        }

        .nav-icon {
            font-size: 20px;
        }

        @media(max-width:500px) {
            .input-grid {
                grid-template-columns: 1fr;
            }

            .info-strip {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="page-container animate-fade-in">
        <a href="/dashboard"
            style="color:var(--text-muted);text-decoration:none;display:inline-flex;align-items:center;gap:8px;margin-bottom:20px;font-weight:500;">
            <i class="fas fa-arrow-left"></i> Dashboard
        </a>
        <div class="hero">
            <div style="font-size:3rem;margin-bottom:12px;">📅</div>
            <h1>Crop Calendar</h1>
            <p style="color:rgba(255,255,255,0.75);margin-top:6px;">Sowing → Harvest schedule with reminders</p>
        </div>

        <div class="form-card">
            <div class="input-grid">
                <div>
                    <label>Select Crop</label>
                    <select class="form-control-farm" id="crop">
                        <option value="rice">🌾 Rice</option>
                        <option value="wheat">🌾 Wheat</option>
                        <option value="tomato">🍅 Tomato</option>
                        <option value="cotton">🌿 Cotton</option>
                    </select>
                </div>
                <div>
                    <label>Sowing Date</label>
                    <input type="date" id="sowingDate" class="form-control-farm">
                </div>
            </div>
            <button class="btn-farm" onclick="getCalendar()"
                style="width:100%;margin-top:18px;font-size:1rem;padding:14px;">
                <i class="fas fa-calendar-alt"></i> Generate Crop Calendar
            </button>
        </div>

        <div id="calendarResult" style="display:none;">
            <div class="info-strip" id="infoStrip"></div>
            <div class="form-card">
                <div
                    style="color:var(--primary-green);font-weight:700;font-size:1.1rem;margin-bottom:20px;display:flex;align-items:center;gap:10px;">
                    <i class="fas fa-tasks"></i> Task Schedule
                </div>
                <div class="timeline" id="timelineList"></div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="/dashboard" class="nav-item"><i class="fas fa-home nav-icon"></i><span>Home</span></a>
        <a href="/weather" class="nav-item"><i class="fas fa-cloud nav-icon"></i><span>Weather</span></a>
        <a href="/calendar" class="nav-item active"><i class="fas fa-calendar nav-icon"></i><span>Calendar</span></a>
        <a href="/irrigation" class="nav-item"><i class="fas fa-tint nav-icon"></i><span>Irrigate</span></a>
        <a href="/schemes" class="nav-item"><i class="fas fa-hand-holding-dollar nav-icon"></i><span>Schemes</span></a>
    </nav>

    <script>
        // Set default date to today
        document.getElementById('sowingDate').value = new Date().toISOString().split('T')[0];

        async function getCalendar() {
            const btn = document.querySelector('.btn-farm');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/crop-calendar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        crop: document.getElementById('crop').value,
                        sowing_date: document.getElementById('sowingDate').value
                    })
                });
                const data = await res.json();

                document.getElementById('infoStrip').innerHTML = `
            <div class="info-item"><div class="info-val">${data.crop}</div><div class="info-lbl">Crop</div></div>
            <div class="info-item"><div class="info-val">${data.sowing_date}</div><div class="info-lbl">Sowing Date</div></div>
            <div class="info-item"><div class="info-val">${data.harvest_date}</div><div class="info-lbl">Harvest Date</div></div>
        `;

                const timeline = document.getElementById('timelineList');
                timeline.innerHTML = '';

                data.tasks.forEach((task, i) => {
                    const isLast = i === data.tasks.length - 1;
                    const statusClass = `status-${task.status}`;
                    const statusColor = task.status === 'completed' ? '#2ecc71' : task.status === 'due-soon' ? '#f1c40f' : 'rgba(255,255,255,0.2)';
                    timeline.innerHTML += `
                <div class="timeline-item">
                    <div class="tl-dot-wrap">
                        <div class="tl-dot ${statusClass}" style="border-color:${statusColor}">${task.task.split(' ')[0]}</div>
                        ${!isLast ? '<div class="tl-line"></div>' : ''}
                    </div>
                    <div class="tl-body">
                        <div class="tl-day">Day ${task.day} — ${task.date} ${task.status === 'due-soon' ? '<span style="color:#f1c40f;font-weight:600;">⏰ Due Soon!</span>' : ''} ${task.status === 'completed' ? '<span style="color:#2ecc71;">✅ Done</span>' : ''}</div>
                        <div class="tl-task">${task.task}</div>
                        <div class="tl-detail">${task.detail}</div>
                    </div>
                </div>
            `;
                });

                document.getElementById('calendarResult').style.display = 'block';
                document.getElementById('calendarResult').scrollIntoView({ behavior: 'smooth' });
            } catch (e) {
                alert('Error generating calendar. Please try again.');
            }

            btn.innerHTML = '<i class="fas fa-calendar-alt"></i> Generate Crop Calendar';
            btn.disabled = false;
        }
    </script>
</body>

</html>
