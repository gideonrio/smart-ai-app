<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seasonal Planning Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .planning-container {
            padding: 20px;
            max-width: 800px;
            margin: 0 auto 100px;
        }

        .input-group {
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .select-field {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 10px;
            color: white;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        .plan-card {
            background: var(--glass-bg);
            border-left: 5px solid var(--primary-green);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            transition: transform 0.2s;
        }

        .plan-card:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.08);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .stat-item {
            background: rgba(46, 204, 113, 0.1);
            padding: 10px;
            border-radius: 10px;
            font-size: 14px;
        }

        .timeline-section {
            margin-top: 40px;
            padding: 20px;
            background: var(--glass-bg);
            border-radius: 20px;
        }

        .timeline-stepper {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
            position: relative;
        }

        .timeline-stepper::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 10px;
            bottom: 10px;
            width: 2px;
            background: var(--border-color);
        }

        .timeline-item {
            display: flex;
            align-items: center;
            gap: 20px;
            position: relative;
        }

        .timeline-icon {
            width: 42px;
            height: 42px;
            background: var(--bg-card);
            border: 2px solid var(--primary-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            z-index: 1;
        }

        .timeline-content {
            flex: 1;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
        }

        .status-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            float: right;
            font-weight: bold;
        }

        .status-Good {
            background: #2ecc71;
            color: #fff;
        }

        .status-Healthy {
            background: #27ae60;
            color: #fff;
        }

        .status-Normal {
            background: #f1c40f;
            color: #000;
        }

        .status-Ready {
            background: #e67e22;
            color: #fff;
        }

        .status-Upcoming {
            background: #7f8c8d;
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="planning-container animate-fade-in">
        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 25px;">
            <a href="/dashboard" style="color: white;"><i class="fas fa-arrow-left fa-lg"></i></a>
            <h1 style="font-size: 24px;">Seasonal Assistant</h1>
        </div>

        <div class="input-group">
            <h3 style="margin-bottom: 15px; color: var(--primary-green);">Configure Your Season</h3>

            <label>Current Season</label>
            <select class="select-field" id="seasonSelect">
                <option value="summer">Summer (Kharif)</option>
                <option value="winter">Winter (Rabi)</option>
                <option value="monsoon">Monsoon (Zaid)</option>
            </select>

            <label>Soil Type</label>
            <select class="select-field" id="soilSelect">
                <option value="loamy">Loamy Soil</option>
                <option value="clay">Clay Soil</option>
                <option value="sandy">Sandy Soil</option>
            </select>

            <button onclick="getPlan()"
                style="width:100%; padding:15px; background:var(--primary-green); border:none; border-radius:12px; color:white; font-weight:700; cursor:pointer;">
                <i class="fas fa-wand-magic-sparkles"></i> Suggest Best Crops
            </button>
        </div>

        <div id="planResults">
            <!-- Results will be shown here -->
        </div>

        <div class="timeline-section">
            <h3 style="margin-bottom: 10px;"><i class="fas fa-chart-line" style="color: var(--primary-green);"></i>
                Growth Timeline Tracker</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Tracking: <b>Tomato Crop (Field
                    A)</b></p>

            <div class="timeline-stepper" id="timelineList">
                <!-- Data from API -->
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="bottom-nav">
        <a href="/dashboard" class="nav-item">
            <i class="fas fa-home nav-icon"></i><span>Home</span>
        </a>
        <a href="/market" class="nav-item">
            <i class="fas fa-chart-line nav-icon"></i><span>Market</span>
        </a>
        <a href="/chatbot" class="nav-item">
            <i class="fas fa-robot nav-icon"></i><span>AI Bot</span>
        </a>
        <a href="/reminder" class="nav-item">
            <i class="fas fa-bell nav-icon"></i><span>Reminders</span>
        </a>
        <a href="/emergency" class="nav-item">
            <i class="fas fa-phone-alt nav-icon"></i><span>Help</span>
        </a>
    </nav>

    <script>
        async function getPlan() {
            const resultsDiv = document.getElementById('planResults');
            resultsDiv.innerHTML = '<div style="text-align:center; padding:20px;"><i class="fas fa-spinner fa-spin"></i> Analyzing...</div>';

            const lat = localStorage.getItem('userLat');
            const lon = localStorage.getItem('userLon');
            const city = localStorage.getItem('userCity');
            
            try {
                const res = await fetch('/api/seasonal-plan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        season: document.getElementById('seasonSelect').value,
                        soil: document.getElementById('soilSelect').value,
                        location: city || (lat ? `Lat:${lat}, Lon:${lon}` : "Regional Farm"),
                        lat: lat,
                        lon: lon
                    })
                });
                const data = await res.json();

                let html = '<h3 style="margin: 20px 0 15px;">Suggested for You:</h3>';
                data.plans.forEach(plan => {
                    html += `
                        <div class="plan-card">
                            <div style="font-size: 18px; font-weight: 800; color: white;">${plan.crop}</div>
                            <div style="font-size: 13px; color: var(--text-muted); margin-top: 5px;">${plan.reason}</div>
                            
                            <div class="stat-grid">
                                <div class="stat-item">
                                    <i class="fas fa-coins" style="color: #f1c40f;"></i><br>
                                    <b>Expected Profit</b><br>${plan.profit}
                                </div>
                                <div class="stat-item">
                                    <i class="fas fa-droplet" style="color: #3498db;"></i><br>
                                    <b>Water Needs</b><br>${plan.water_needs}
                                </div>
                            </div>
                        </div>
                    `;
                });
                resultsDiv.innerHTML = html;
            } catch (err) {
                resultsDiv.innerHTML = '<p>Error loading suggestions.</p>';
            }
        }

        async function loadTimeline() {
            try {
                const res = await fetch('/api/crop-timeline');
                const data = await res.json();
                const list = document.getElementById('timelineList');
                list.innerHTML = '';

                data.timeline.forEach(item => {
                    const statusClass = item.status.split(' ')[0];
                    list.innerHTML += `
                        <div class="timeline-item">
                            <div class="timeline-icon">${item.icon}</div>
                            <div class="timeline-content">
                                <span class="status-badge status-${statusClass}">${item.status}</span>
                                <div style="font-weight: 700;">Week ${item.week}</div>
                                <div style="font-size: 13px; color: var(--text-muted);">${item.desc}</div>
                            </div>
                        </div>
                    `;
                });
            } catch (err) { }
        }

        document.addEventListener('DOMContentLoaded', () => {
            getPlan();
            loadTimeline();
        });
    </script>
</body>

</html>
