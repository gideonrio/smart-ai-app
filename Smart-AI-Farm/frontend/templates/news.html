<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agricultural News | Smart Farm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #2E7D32;
            --accent-green: #4CAF50;
            --light-bg: #E8F5E9;
            --dark-text: #1B5E20;
        }

        body {
            background-color: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding-bottom: 60px;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-green), var(--accent-green));
            color: white;
            padding: 2rem 0 3rem;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-weight: 700;
            font-size: 2.2rem;
        }

        .header p {
            opacity: 0.9;
        }

        .news-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s;
            border-left: 5px solid var(--accent-green);
        }

        .news-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }

        .news-date {
            color: #757575;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
        }

        .news-title {
            color: var(--dark-text);
            font-weight: 600;
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .news-summary {
            color: #555;
            font-size: 0.95rem;
            margin-bottom: 0;
        }

        .full-content {
            display: none;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px dashed #ccc;
            color: #333;
            font-size: 0.95rem;
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .read-more-btn {
            background: none;
            border: none;
            color: var(--primary-green);
            font-weight: 600;
            padding: 0;
            margin-top: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: underline;
        }

        .loading-spinner {
            display: flex;
            justify-content: center;
            padding: 3rem;
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="container">
            <a href="/dashboard"
                style="color:white;text-decoration:none;display:inline-flex;align-items:center;gap:8px;margin-bottom:15px;font-weight:500;">
                <i class="fas fa-arrow-left"></i> Dashboard
            </a>
            <h1><i class="fas fa-newspaper"></i> Agricultural News</h1>
            <p>Latest updates, weather warnings, and farming innovations</p>
        </div>
    </div>

    <div class="container" style="max-width: 800px;">
        <div id="loading" class="loading-spinner">
            <div class="spinner-border text-success" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div id="news-container">
            <!-- News items injected here -->
        </div>

        <div class="text-center mt-4 mb-4">
            <a href="/dashboard" class="btn btn-outline-success">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>
    </div>

    <script>
        function toggleNews(id) {
            const content = document.getElementById(`full-news-${id}`);
            const btn = document.getElementById(`btn-news-${id}`);
            if (content.style.display === 'none' || content.style.display === '') {
                content.style.display = 'block';
                btn.innerHTML = 'Show Less <i class="fas fa-chevron-up"></i>';
            } else {
                content.style.display = 'none';
                btn.innerHTML = 'Read Full Story <i class="fas fa-chevron-down"></i>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Mark notifications as read when visiting this page
            fetch('/api/notifications/mark-read', { method: 'POST' });

            fetch('/api/news')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loading').style.display = 'none';
                    const container = document.getElementById('news-container');

                    data.forEach((item, index) => {
                        const card = document.createElement('div');
                        card.className = 'news-card';

                        const fullTextHtml = item.full_text ? `
                            <button id="btn-news-${index}" class="read-more-btn" onclick="toggleNews(${index})">Read Full Story <i class="fas fa-chevron-down"></i></button>
                            <div id="full-news-${index}" class="full-content">${item.full_text}</div>
                        ` : '';

                        card.innerHTML = `
                            <div class="news-date">
                                <span><i class="fas fa-calendar-alt"></i> ${item.date}</span>
                                <span class="badge bg-success bg-opacity-75">${item.source}</span>
                            </div>
                            <h3 class="news-title">${item.title}</h3>
                            <p class="news-summary">${item.summary}</p>
                            ${fullTextHtml}
                        `;
                        container.appendChild(card);
                    });
                })
                .catch(error => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('news-container').innerHTML = `
                        <div class="alert alert-danger">
                            Failed to load latest news. Please check your connection.
                        </div>
                    `;
                });
        });
    </script>
</body>

</html>
