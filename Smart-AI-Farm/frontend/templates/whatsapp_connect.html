<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Connect - Smart AI Farm</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .connect-container {
            padding: 80px 20px 40px;
            max-width: 600px;
            margin: 0 auto;
        }

        .header-banner {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(37, 211, 102, 0.1);
            border: 1px solid rgba(37, 211, 102, 0.2);
            border-radius: 20px;
        }

        .header-icon {
            font-size: 48px;
            color: #25d366;
            margin-bottom: 10px;
        }

        .form-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: white;
            font-size: 14px;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .form-control {
            width: 100%;
            padding: 12px 14px 12px 40px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: #25d366;
            background: rgba(0, 0, 0, 0.3);
        }

        textarea.form-control {
            padding-left: 14px;
            min-height: 100px;
            resize: vertical;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-wa {
            background: linear-gradient(135deg, #25d366, #128C7E);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }

        .btn-wa:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
        }

        .btn-call {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }

        .btn-call:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4);
        }

        .btn-video {
            background: linear-gradient(135deg, #e67e22, #d35400);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }

        .btn-video:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.4);
        }
    </style>
</head>

<body>
    <div class="connect-container animate-fade-in">
        <a href="/dashboard"
            style="color:var(--text-muted);text-decoration:none;display:inline-flex;align-items:center;gap:8px;margin-bottom:20px;font-weight:500;">
            <i class="fas fa-arrow-left"></i> Dashboard
        </a>

        <div class="header-banner">
            <i class="fab fa-whatsapp header-icon"></i>
            <h1 style="font-size: 24px; margin-bottom: 5px; color: white;">Farmer Connect</h1>
            <p style="opacity: 0.9; color: var(--text-muted);">Instantly connect with other farmers via WhatsApp or
                Phone</p>
        </div>

        <div class="form-card">
            <div class="form-group">
                <label class="form-label">Phone Number (with Country Code)</label>
                <div class="input-with-icon">
                    <i class="fas fa-phone-alt"></i>
                    <input type="tel" id="phoneNumber" class="form-control" placeholder="+91 9876543210" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Message (Optional)</label>
                <textarea id="messageText" class="form-control"
                    placeholder="Hi friend, I saw your equipment for rent..."></textarea>
            </div>

            <div class="action-buttons">
                <!-- WhatsApp Message -->
                <button onclick="sendAppMessage()" class="btn-wa">
                    <i class="fab fa-whatsapp"></i> Send WhatsApp Message
                </button>

                <!-- Normal Phone Call -->
                <button onclick="makeNormalCall()" class="btn-call">
                    <i class="fas fa-phone-alt"></i> Normal Phone Call
                </button>

                <!-- Video Call (Directs to WhatsApp as best-effort for web without native linking) -->
                <button onclick="makeVideoCall()" class="btn-video">
                    <i class="fas fa-video"></i> WhatsApp Video Call
                </button>
            </div>

            <div id="errorMsg" style="color: #e74c3c; margin-top: 15px; text-align: center; display: none;">
                Please enter a valid phone number.
            </div>
        </div>
    </div>

    <script>
        function getCleanNumber() {
            let num = document.getElementById('phoneNumber').value.trim();
            // Remove any non-numeric characters except +
            num = num.replace(/[^\d+]/g, '');
            if (!num) return null;
            return num;
        }

        function getMessage() {
            return encodeURIComponent(document.getElementById('messageText').value.trim());
        }

        function showError() {
            document.getElementById('errorMsg').style.display = 'block';
            setTimeout(() => {
                document.getElementById('errorMsg').style.display = 'none';
            }, 3000);
        }

        function sendAppMessage() {
            const num = getCleanNumber();
            if (!num) return showError();
            const msg = getMessage();
            window.open(`https://wa.me/${num}?text=${msg}`, '_blank');
        }

        function makeNormalCall() {
            const num = getCleanNumber();
            if (!num) return showError();
            window.location.href = `tel:${num}`;
        }

        function makeVideoCall() {
            const num = getCleanNumber();
            if (!num) return showError();
            // There's no standard universal "WhatsApp video call" deep link that officially works cross-platform via web 
            // except prompting them in chat to click the video icon.
            // On some mobile devices, 'whatsapp://call?number=' or similar intent might work but it's sketchy.
            // The safest fallback is open WA chat asking for a video call.
            const msg = encodeURIComponent("Hi, are you available for a WhatsApp Video Call right now?");
            window.open(`https://api.whatsapp.com/send?phone=${num}&text=${msg}`, '_blank');
        }
    </script>
</body>

</html>
