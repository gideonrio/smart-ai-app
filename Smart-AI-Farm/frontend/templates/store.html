<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agri Store | Smart AI Farm</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .page-container {
            padding: 20px 20px 80px;
            max-width: 900px;
            margin: 0 auto;
        }

        .hero {
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            border-radius: 24px;
            padding: 28px;
            margin-bottom: 24px;
            text-align: center;
        }

        .hero h1 {
            font-size: 2rem;
            font-weight: 800;
        }

        .filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .filter-btn {
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--glass-bg);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: var(--primary-green);
            color: white;
            border-color: var(--primary-green);
        }

        .store-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
        }

        .product-card {
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 20px;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-green);
            box-shadow: 0 10px 30px rgba(46, 204, 113, 0.15);
        }

        .prod-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 14px;
        }

        .prod-badge {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 3px 10px;
            border-radius: 10px;
            font-weight: 600;
        }

        .prod-name {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .prod-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 14px;
            flex: 1;
            line-height: 1.5;
        }

        .price-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 14px;
        }

        .price-now {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary-green);
        }

        .price-mrp {
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: line-through;
        }

        .price-off {
            font-size: 12px;
            background: rgba(46, 204, 113, 0.15);
            color: var(--primary-green);
            padding: 2px 8px;
            border-radius: 8px;
            font-weight: 600;
        }

        .stars {
            color: #f1c40f;
            font-size: 13px;
            margin-bottom: 14px;
        }

        .buy-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(to right, #e67e22, #f39c12);
            color: white;
            padding: 10px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }

        .buy-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(243, 156, 18, 0.4);
            color: white;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 100;
        }

        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            gap: 5px;
            font-weight: 500;
        }

        .nav-item.active,
        .nav-item:hover {
            color: var(--primary-green);
        }

        .nav-icon {
            font-size: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <div class="page-container animate-fade-in">
        <a href="/dashboard"
            style="color:var(--text-muted);text-decoration:none;display:inline-flex;align-items:center;gap:8px;margin-bottom:20px;font-weight:500;">
            <i class="fas fa-arrow-left"></i> Dashboard
        </a>
        <div class="hero">
            <div style="font-size:3rem;margin-bottom:12px;">🛒</div>
            <h1>Agri Store</h1>
            <p style="color:rgba(255,255,255,0.8);">Best fertilizers, pesticides & equipment at great prices</p>
        </div>

        <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" onclick="filterProducts('All', this)">All</button>
            <button class="filter-btn" onclick="filterProducts('Fertilizer', this)">🌱 Fertilizer</button>
            <button class="filter-btn" onclick="filterProducts('Pesticide', this)">🐛 Pesticide</button>
            <button class="filter-btn" onclick="filterProducts('Fungicide', this)">🍄 Fungicide</button>
            <button class="filter-btn" onclick="filterProducts('Equipment', this)">⚙️ Equipment</button>
            <button class="filter-btn" onclick="filterProducts('Organic', this)">♻️ Organic</button>
        </div>

        <div id="storeGrid" class="store-grid">
            <div class="loading"><i class="fas fa-spinner fa-spin fa-2x"></i><br><br>Loading products...</div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="/dashboard" class="nav-item"><i class="fas fa-home nav-icon"></i><span>Home</span></a>
        <a href="/chatbot" class="nav-item"><i class="fas fa-robot nav-icon"></i><span>AI Bot</span></a>
        <a href="/store" class="nav-item active"><i class="fas fa-store nav-icon"></i><span>Store</span></a>
        <a href="/schemes" class="nav-item"><i class="fas fa-hand-holding-dollar nav-icon"></i><span>Schemes</span></a>
        <a href="/calendar" class="nav-item"><i class="fas fa-calendar nav-icon"></i><span>Calendar</span></a>
    </nav>

    <script>
        let allProducts = [];
        const catColors = {
            'Fertilizer': '#2ecc71', 'Pesticide': '#e74c3c', 'Fungicide': '#9b59b6',
            'Equipment': '#3498db', 'Organic': '#27ae60'
        };
        const catIcons = {
            'Fertilizer': '#2ecc7115', 'Pesticide': '#e74c3c15', 'Fungicide': '#9b59b615',
            'Equipment': '#3498db15', 'Organic': '#27ae6015'
        };

        function renderStars(rating) {
            const full = Math.floor(rating);
            const half = rating % 1 >= 0.5;
            let s = '';
            for (let i = 0; i < full; i++) s += '★';
            if (half) s += '½';
            return s + ` (${rating})`;
        }

        function renderProducts(products) {
            const grid = document.getElementById('storeGrid');
            if (!products.length) { grid.innerHTML = '<div class="loading">No products found.</div>'; return; }
            grid.innerHTML = '';
            products.forEach(p => {
                const discount = Math.round((1 - p.price / p.mrp) * 100);
                const color = catColors[p.category] || '#2ecc71';
                const bgColor = catIcons[p.category] || '#2ecc7115';
                grid.innerHTML += `
            <div class="product-card">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">
                    <div class="prod-icon" style="background:${bgColor};color:${color}"><i class="fas ${p.icon}"></i></div>
                    <span class="prod-badge" style="background:${bgColor};color:${color}">${p.category}</span>
                </div>
                <div class="prod-name">${p.name}</div>
                <div class="prod-desc">${p.description}</div>
                <div class="stars">${renderStars(p.rating)}</div>
                <div class="price-row">
                    <span class="price-now">₹${p.price.toLocaleString('en-IN')}</span>
                    <span class="price-mrp">₹${p.mrp.toLocaleString('en-IN')}</span>
                    <span class="price-off">${discount}% off</span>
                </div>
                <a href="${p.amazon_link}" target="_blank" class="buy-btn">
                    <i class="fab fa-amazon"></i> Buy on Amazon
                </a>
            </div>
        `;
            });
        }

        function filterProducts(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (cat === 'All') renderProducts(allProducts);
            else renderProducts(allProducts.filter(p => p.category === cat));
        }

        fetch('/api/store')
            .then(r => r.json())
            .then(data => { allProducts = data; renderProducts(data); })
            .catch(() => { document.getElementById('storeGrid').innerHTML = '<div class="loading">Failed to load store. Please refresh.</div>'; });
    </script>
</body>

</html>
